name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Compile
        run: python3 -m py_compile receiver.py tests/test_receiver.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
