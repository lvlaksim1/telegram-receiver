name: Direct Pair Telegram Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[DIRECT_PAIR_DIAGNOSTIC]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send two direct messages
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import time
          import urllib.request

          def send(text):
              payload = json.dumps({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": text
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if data.get("ok") is not True:
                  raise SystemExit("Telegram sendMessage failed")
              return data["result"]

          a = send("DIRECT_A")
          print(f"a_id={a.get('message_id')}")
          print(f"a_date={a.get('date')}")
          time.sleep(30)
          b = send("DIRECT_B")
          print(f"b_id={b.get('message_id')}")
          print(f"b_date={b.get('date')}")
          PY

      - name: Report metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          A_ID: ${{ steps.send.outputs.a_id }}
          A_DATE: ${{ steps.send.outputs.a_date }}
          B_ID: ${{ steps.send.outputs.b_id }}
          B_DATE: ${{ steps.send.outputs.b_date }}
        shell: bash
        run: |
          BODY="DIRECT_PAIR_OK A=$A_ID/$A_DATE B=$B_ID/$B_DATE"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$BODY"
