name: Telegram Receiver

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - receiver_start
      - receiver_rearm

permissions:
  contents: write

concurrency:
  group: telegram-receiver-worker
  cancel-in-progress: false
  queue: max

jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v4

      - name: Read receiver state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          ENABLED="$(jq -r '.enabled == true' receiver-config.json)"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - name: Preflight
        if: steps.state.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONSUMER_DISPATCH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: python3 receiver.py check

      - name: Queue successor
        if: steps.state.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"event_type":"receiver_rearm","client_payload":{"source":"worker"}}' |
            gh api               --method POST               "repos/${GITHUB_REPOSITORY}/dispatches"               --input -

      - name: Receive Telegram updates
        if: steps.state.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONSUMER_DISPATCH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: python3 receiver.py run

      - name: Disabled
        if: steps.state.outputs.enabled != 'true'
        run: echo "Receiver is disabled in receiver-config.json"
